<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Tab</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="time-date">
                <span id="time">--:--:--</span>
                <span id="date">----/--/--</span>
            </div>
            <h1>Chill Tab</h1>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="search" placeholder="Search...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>

            <div class="links">
                <a href="https://github.com"><i class="fab fa-github"></i> GitHub</a>
                <a href="https://gmail.com"><i class="fas fa-envelope"></i> Gmail</a>
                <a href="https://youtube.com"><i class="fab fa-youtube"></i> YouTube</a>
                <a href="https://google.com"><i class="fas fa-search"></i> Google</a>
            </div>

            <div class="todo">
                <h2><i class="fas fa-check"></i> Todo</h2>
                <div class="todo-input">
                    <input type="text" id="todo-text" placeholder="Add task...">
                    <button id="add-todo"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="todo-list"></ul>
            </div>

            <div class="weather">
                <h2><i class="fas fa-cloud-sun"></i> Weather</h2>
                <div id="weather-info">
                    <span id="weather-temp">--°C</span>
                    <span id="weather-desc">Loading...</span>
                </div>
            </div>
        </main>

    <script src="main.js"></script>
</body>
</html>
